schema_version: 1

context:
  version: "0.26.0"

package:
  name: cartopy_offlinedata
  version: ${{ version }}

source:
  # used for the download tool
  url: https://pypi.org/packages/source/c/cartopy/cartopy-${{ version }}.tar.gz
  sha256: b87a35835f30333760cc46194bd90b6a4958d12f488f50131d4c4c0962ad9c3c

build:
  number: 0
  noarch: python
  script: build.sh

requirements:
  host:
    - python ${{ python_min }}.*
    - cartopy ${{ version }}.*
  run:
    - python >=${{ python_min }}
    - cartopy >=${{ version }}


tests:
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      # pick a few random things to check for
      - test -f $PREFIX/share/cartopy/shapefiles/natural_earth/physical/ne_10m_antarctic_ice_shelves_polys.shp
      - test -f $PREFIX/share/cartopy/shapefiles/natural_earth/physical/ne_10m_coastline.shp
      - test -f $PREFIX/share/cartopy/shapefiles/natural_earth/cultural/ne_50m_urban_areas.shp

about:
  homepage: https://scitools.org.uk/cartopy
  summary: Offline data for using cartopy without an internet connection
  license: GPL-3.0-only
  license_file:
    - licenses/LICENSE_NACISCDN_NaturalEarth
    - licenses/LICENSE_NOAA_NGDC_GSHHS
  repository: https://github.com/SciTools/cartopy
  documentation: https://scitools.org.uk/cartopy/docs/latest/

extra:
  recipe-maintainers:
    - ocefpaf
    - willirath
    - xylar
